name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Type-check, test and build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # onnxruntime-node докачивает нативные бинарники в postinstall, и этот
        # шаг уже падал по таймауту к чужой CDN. Две повторные попытки дешевле
        # красного прогона из-за сети, а сам пакет нужен: на нём работает VAD.
        shell: bash
        run: npm ci || (sleep 15 && npm ci) || (sleep 60 && npm ci)

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The suite needs no ffmpeg, no network and no API keys — that is a project rule.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
