name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: the tool is for private copying and will never gain features that
        upload, publish or distribute the produced track. Everything else is open for
        discussion.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: I dub Korean videos, and the translations come out truncated because …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change as you see it. A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Settings, workarounds, other tools — and why they did not fit.

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to implement it?
      options:
        - label: I am willing to open a pull request for this
